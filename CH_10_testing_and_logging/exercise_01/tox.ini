[tox]
env_list = static
skipsdist = true

[testenv:static]
description = type-check the maintained Chapter 10 implementation
base_python = python3.10
package = skip
deps =
    mypy>=1.18
    pytest>=9.0
change_dir = {tox_root}/../..
commands =
    mypy \
        CH_10_testing_and_logging/exercise_01/__init__.py \
        CH_10_testing_and_logging/exercise_01/doctest_runner.py \
        CH_10_testing_and_logging/exercise_01/file_documentation_plugin.py \
        CH_10_testing_and_logging/exercise_01/solution_00.py \
        CH_10_testing_and_logging/exercise_01/task_logging.py
