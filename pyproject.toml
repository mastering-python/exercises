[project]
name = "mastering-python-exercises"
version = "0.1.0"
description = "Tested solutions for Mastering Python Second Edition exercises"
readme = "README.rst"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "docutils>=0.21",
    "mypy>=1.18",
    "pyrefly>=0.59",
    "pyright>=1.1.411",
    "pyyaml>=6.0",
    "pytest>=9.0",
    "pytest-timeout>=2.4",
    "ruff>=0.15",
]
interactive = [
    "colorama>=0.4.6",
    "ipython>=8.37",
    "ipywidgets>=8.1",
    "jedi>=0.19",
]
scientific = [
    "datashader>=0.18",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "numpy>=1.26",
    "pandas>=2.2",
]
nlp = [
    "spacy>=3.8.13,<3.8.14",
    "typer>=0.25,<0.26",
]
native = [
    "build>=1.3",
    "cffi>=1.17",
    "setuptools>=80",
    "wheel>=0.45",
]
packaging = [
    "build>=1.3",
    "setuptools>=80",
    "tox>=4.30",
    "wheel>=0.45",
]

[tool.uv]
package = false
default-groups = ["dev"]
